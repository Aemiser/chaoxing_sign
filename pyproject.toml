[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoxing-sign"
version = "3.0.0"
description = "超星学习通自动化签到工具"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pycryptodome>=3.15.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "pyjwt>=2.0.0",
    "eval_type_backport>=0.2.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.25.0",
    "ddddocr>=1.5.0",
]

[project.scripts]
chaoxing-sign = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaoxing_sign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
