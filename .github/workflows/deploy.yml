name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is not set. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST secret is not set. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets are set"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking=accept-new" >> ~/.ssh/config

      - name: Deploy files to server
        run: |
          # 打包项目文件（排除敏感/无关项），通过 SSH 管道直传到服务器
          tar czf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.ruff_cache' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='config.json' \
            --exclude='session.json' \
            --exclude='tests' \
            --exclude='README.md' \
            --exclude='ARCHITECTURE.md' \
            . | ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            'rm -rf /opt/chaoxing-sign/chaoxing_sign /opt/chaoxing-sign/static /opt/chaoxing-sign/server.py /opt/chaoxing-sign/main.py /opt/chaoxing-sign/requirements.txt /opt/chaoxing-sign/.gitignore && tar xzf - -C /opt/chaoxing-sign/'
          echo "Files deployed successfully"

      - name: Install deps & restart service
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} << 'REMOTE_EOF'
            set -e
            cd /opt/chaoxing-sign

            # 确保 systemd 服务使用 main.py -s（兼容旧版 server.py / main.py -server 路径）
            SERVICE_FILE=/etc/systemd/system/chaoxing-sign.service
            if ! grep -q 'ExecStart=.*main\.py -s$' "$SERVICE_FILE" 2>/dev/null; then
              echo "Updating systemd service ExecStart to main.py -s..."
              sed -i 's|ExecStart=.*|ExecStart=/opt/chaoxing-sign/venv/bin/python /opt/chaoxing-sign/main.py -s|' "$SERVICE_FILE"
              systemctl daemon-reload
            fi

            /opt/chaoxing-sign/venv/bin/pip install -r requirements.txt -q
            systemctl restart chaoxing-sign
            sleep 2
            if ! systemctl is-active --quiet chaoxing-sign; then
              echo "SERVICE FAILED TO START"
              journalctl -u chaoxing-sign --no-pager -n 20
              exit 1
            fi
            echo "--- health check ---"
            curl -sf http://127.0.0.1:8000/health
          REMOTE_EOF
