<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑块距离手动测量工具</title>
<style>
  body { font-family: Arial,sans-serif; background:#1a1a2e; color:#eee; text-align:center; padding:20px; }
  .container { max-width:600px; margin:0 auto; }
  input[type=text] { width:100%; padding:8px; margin:4px 0; border:1px solid #444; border-radius:4px; background:#16213e; color:#eee; box-sizing:border-box; }
  button { padding:10px 24px; margin:8px 4px; border:none; border-radius:4px; cursor:pointer; font-size:14px; }
  .btn-load { background:#0f3460; color:#fff; }
  .btn-load:hover { background:#1a4a7a; }
  .slider-wrap { position:relative; display:inline-block; margin:16px 0; user-select:none; touch-action:none;
                  outline:2px solid #333; }
  .slider-wrap img { display:block; }
  #cutout { position:absolute; top:0; left:0; cursor:grab; opacity:0.55; }
  #cutout:active { cursor:grabbing; }
  .info { background:#16213e; padding:12px; border-radius:6px; margin:10px 0; text-align:left; }
  .info .val { color:#e94560; font-weight:bold; font-size:1.2em; }
  .info .row { margin:4px 0; }
  .hint { color:#888; font-size:13px; }
  .ctrl { display:flex; gap:8px; align-items:center; justify-content:center; margin:8px 0; }
  .ctrl label { font-size:13px; color:#aaa; }
  .ctrl input[type=range] { width:120px; }
  .ctrl input[type=number] { width:60px; }
</style>
</head>
<body>
<div class="container">
  <h2>滑块距离手动测量</h2>
  <p class="hint">填充 shadeImage / cutoutImage URL，拖动半透明缺口图对齐背景</p>

  <input id="shade-url" placeholder="shadeImage（背景大图）URL">
  <input id="cutout-url" placeholder="cutoutImage（缺口小图）URL">
  <button class="btn-load" onclick="loadImages()">加载图片</button>

  <div class="ctrl">
    <label>透明度:</label>
    <input type="range" id="opacity-slider" min="10" max="100" value="55" oninput="applyOpacity()">
    <span id="opacity-val">55%</span>
  </div>

  <div class="slider-wrap" id="slider-wrap" style="display:none;">
    <img id="bg-img" draggable="false">
    <img id="cutout" draggable="false">
  </div>

  <div class="info">
    <div class="row">X 偏移: <span class="val" id="x-val">0</span> px</div>
    <div class="row">Y 偏移: <span class="val" id="y-val">0</span> px</div>
    <div class="row" style="color:#888;font-size:12px;">
      ←→↑↓ 方向键微调 (±1px) &nbsp;|&nbsp; Shift+方向键 粗调 (±10px)
    </div>
  </div>
</div>

<script>
let ox = 0, oy = 0, dragging = false, startX = 0, startY = 0, startOx = 0, startOy = 0;
const bg    = document.getElementById('bg-img');
const ct    = document.getElementById('cutout');
const xVal  = document.getElementById('x-val');
const yVal  = document.getElementById('y-val');
const wrap  = document.getElementById('slider-wrap');

function loadImages() {
  const s = document.getElementById('shade-url').value.trim();
  const c = document.getElementById('cutout-url').value.trim();
  if (!s || !c) return alert('请填入两个图片 URL');
  bg.src = s;
  ct.src = c;
  bg.onload = () => {
    ox = oy = 0;
    ct.style.left = '0px';
    ct.style.top  = '0px';
    xVal.textContent = '0';
    yVal.textContent = '0';
    wrap.style.display = 'inline-block';
  };
}

function applyOpacity() {
  const v = document.getElementById('opacity-slider').value;
  ct.style.opacity = v / 100;
  document.getElementById('opacity-val').textContent = v + '%';
}

function update() {
  ct.style.left = ox + 'px';
  ct.style.top  = oy + 'px';
  xVal.textContent = ox;
  yVal.textContent = oy;
}

ct.addEventListener('pointerdown', e => {
  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  startOx = ox;
  startOy = oy;
  ct.setPointerCapture(e.pointerId);
});

ct.addEventListener('pointermove', e => {
  if (!dragging) return;
  ox = startOx + (e.clientX - startX);
  oy = startOy + (e.clientY - startY);
  update();
});

ct.addEventListener('pointerup', () => { dragging = false; });
ct.addEventListener('pointercancel', () => { dragging = false; });

document.addEventListener('keydown', e => {
  if (wrap.style.display === 'none') return;
  const step = e.shiftKey ? 10 : 1;
  let act = false;
  if (e.key === 'ArrowLeft')  { ox -= step; act = true; }
  if (e.key === 'ArrowRight') { ox += step; act = true; }
  if (e.key === 'ArrowUp')    { oy -= step; act = true; }
  if (e.key === 'ArrowDown')  { oy += step; act = true; }
  if (act) { update(); e.preventDefault(); }
});
</script>
</body>
</html>
